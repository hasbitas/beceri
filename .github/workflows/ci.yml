name: ci
on:
  push:
    branches: [main]
  pull_request:
# Yalnız okuma: iş akışı depoya yazmaz.
permissions:
  contents: read
jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q -p no:cacheprovider
      - run: python -m ruff check src tests
      - run: python -m beceri dogrula --kati skills
      - run: python -m beceri benchmark butunluk
      - run: python -m beceri benchmark dogrula
